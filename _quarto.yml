# ---------------------------------------------------------------------------
# Project-wide configuration.
#
# Because `type: website`, Quarto renders every .qmd in this folder into a
# linked site and builds the sidebar below. This is what lets you click from
# one report to the next.
#
# Options set under `format:` here apply to EVERY report, so you only ever
# tune them in one place. An individual .qmd can still override any of them
# in its own YAML header.
# ---------------------------------------------------------------------------

project:
  type: website
  output-dir: _site

website:
  title: "Lorem Ipsum Analytica"
  description: "Consectetur adipiscing elit sed do eiusmod tempor."

  sidebar:
    style: docked          # "docked" = permanent panel; "floating" = collapsible
    search: true
    collapse-level: 2
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Reports"
        contents:
          - text: "Report 1"
            href: report-1.qmd
          - text: "Report 2"
            href: report-2.qmd
          - text: "Report 3"
            href: report-3.qmd
      # To add Report 4: copy report-3.qmd to report-4.qmd, then add
      #   - text: "Report 4"
      #     href: report-4.qmd
      # directly below. Nothing else needs to change.

  page-footer:
    center: "Lorem ipsum dolor sit amet."

format:
  html:
    theme: cosmo
    css: styles.css
    page-layout: full
    title-block-banner: true
    toc: true
    toc-depth: 2
    toc-location: right    # sidebar owns the left edge, so the TOC sits right
    number-sections: false
    html-math-method: mathjax
    code-fold: true
    code-summary: "Show the code"
    code-overflow: wrap
    code-copy: hover
    code-tools:
      source: false
      toggle: true
      caption: "See code"

bibliography: references/references.bib

execute:
  warning: false
  error: false
